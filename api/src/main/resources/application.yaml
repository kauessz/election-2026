spring:
  application:
    name: election-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/election}
    username: ${DATABASE_USERNAME:election}
    password: ${DATABASE_PASSWORD:election}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info