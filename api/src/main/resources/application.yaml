spring:
  application:
    name: election-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/election}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:election}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:election}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${PORT:8081}

app:
  admin:
    api-key: ${ADMIN_API_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

polling:
  aggregation:
    half-life-days: 3
    max-institute-weight: 0.15
    historical-min-factor: 0.85
    historical-max-factor: 1.15
    historical-neutral-spread-error: 3
    historical-election-key: BR-PRESIDENT-2026
    historical-round: 1

tse:
  results:
    base-url: ${TSE_RESULTS_BASE_URL:https://resultados.tse.jus.br}
    environment: ${TSE_RESULTS_ENVIRONMENT:oficial}
    year: ${TSE_RESULTS_YEAR:2026}
    election-id: "${TSE_RESULTS_ELECTION_ID:6258}"
    president-office-code: "${TSE_RESULTS_PRESIDENT_OFFICE_CODE:0001}"
    polling-interval: ${TSE_RESULTS_POLLING_INTERVAL:5s}
    connect-timeout: ${TSE_RESULTS_CONNECT_TIMEOUT:3s}
    read-timeout: ${TSE_RESULTS_READ_TIMEOUT:5s}
    stale-threshold: ${TSE_RESULTS_STALE_THRESHOLD:2m}
    state-interval: ${TSE_RESULTS_STATE_INTERVAL:1s}
    municipality-interval: ${TSE_RESULTS_MUNICIPALITY_INTERVAL:30s}
    minimum-request-interval: ${TSE_RESULTS_MINIMUM_REQUEST_INTERVAL:500ms}
    scheduling-enabled: ${TSE_RESULTS_SCHEDULING_ENABLED:${election.tse.enabled:true}}

election:
  tse:
    enabled: ${ELECTION_TSE_ENABLED:true}
  projection:
    enabled: ${ELECTION_PROJECTION_ENABLED:true}
    prior-equivalent-progress: ${ELECTION_PROJECTION_PRIOR_EQUIVALENT_PROGRESS:0.05}
    minimum-national-electorate-progress: ${ELECTION_PROJECTION_MINIMUM_NATIONAL_ELECTORATE_PROGRESS:0.05}
    minimum-states-with-data: ${ELECTION_PROJECTION_MINIMUM_STATES_WITH_DATA:10}
    high-coverage-progress: ${ELECTION_PROJECTION_HIGH_COVERAGE_PROGRESS:0.80}
    minimum-observed-progress-without-baseline: ${ELECTION_PROJECTION_MINIMUM_OBSERVED_PROGRESS_WITHOUT_BASELINE:0.80}
    minimum-regions-with-data: ${ELECTION_PROJECTION_MINIMUM_REGIONS_WITH_DATA:4}
    minimum-key-states-with-data: ${ELECTION_PROJECTION_MINIMUM_KEY_STATES_WITH_DATA:3}
