# No local credentials or origins are accepted implicitly in production.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
server:
  address: 0.0.0.0
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
election:
  tse:
    enabled: ${ELECTION_TSE_ENABLED:true}
management:
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  structured:
    format:
      console: logstash
  level:
    com.zaxxer.hikari: WARN
    org.flywaydb.core: WARN
    org.hibernate.orm.connections.pooling: WARN
