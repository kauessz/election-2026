name: Release validation (publication blocked)

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full master commit SHA to validate; this does not authorize publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'kauessz/election-2026' &&
      github.ref == 'refs/heads/master' &&
      github.ref_type == 'branch' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref_protected == true && inputs.expected_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate API with disposable Testcontainers databases
        working-directory: api
        run: bash mvnw -B -ntp verify
      - name: Validate frontend
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run lint
          npx --no-install tsc --noEmit
          npm run build
