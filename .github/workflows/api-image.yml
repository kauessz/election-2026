name: API image (GHCR)

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Define image name
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/election-2026-api" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build and push immutable SHA tag
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --file api/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" api
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Update master alias
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:master"
          docker push "$IMAGE:master"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
